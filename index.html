<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siti pubblicati — Qualifix Service</title>
<style>
  :root {
    --primario: #2c3e50;
    --primario-scuro: #1a252f;
    --accento: #e67e22;
    --sfondo: #f8f9fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--sfondo);
    color: #2b2b2b;
  }
  header {
    background: linear-gradient(135deg, var(--primario) 0%, var(--primario-scuro) 100%);
    color: #fff;
    padding: 48px 24px;
    text-align: center;
    border-bottom: 3px solid var(--accento);
  }
  header h1 { margin: 0 0 8px; font-size: 1.8rem; }
  header p { margin: 0; color: #cfd8e2; }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 14px;
  }
  li a {
    display: block;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 10px;
    padding: 18px 22px;
    text-decoration: none;
    color: var(--primario);
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  li a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
  }
  li a span {
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
    color: #5a6570;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Siti pubblicati</h1>
  <p>Qualifix Service</p>
</header>

<main>
  <ul>
    <li>
      <a href="./sviluppo-lamiera/">
        Sviluppo Lamiera
        <span>Fattore K, sviluppo lamiera, sequenza di piega</span>
      </a>
    </li>
    <!-- aggiungere qui una riga per ogni nuovo sito -->
  </ul>
</main>

</body>
</html>
